name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript canonical contracts and desktop bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm 10.34.5
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
          run_install: false

      - name: Install Node.js 22.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundles
        run: pnpm build

      - name: Check TypeScript
        run: pnpm check

      - name: Test TypeScript packages
        run: pnpm test

      - name: Install Chromium for desktop browser tests
        run: pnpm --dir apps/desktop exec playwright install --with-deps chromium

      - name: Test desktop responsive and accessibility behavior in Chromium
        run: pnpm --dir apps/desktop test:browser

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  rust:
    name: Rust canonical engine and crash recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install stable Rust with rustfmt and Clippy
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      - name: Test Rust canonical engine and recovery
        run: cargo test --locked --all-features --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Verify release-mode storage performance budgets
        run: |
          cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            video::project::tests::generated_10k_record_journal_scans_correctly_and_meets_release_budget -- --exact --nocapture
          cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            video::project::tests::durable_command_acknowledgement_p95_meets_budget -- --exact --nocapture
          cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            video::jobs::store::tests::enqueue_with_durable_event_p95_meets_release_budget -- --exact --nocapture
          cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            video::jobs::store::tests::list_100_recent_jobs_meets_release_budget -- --exact --nocapture
          cargo test --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml \
            video::jobs::store::tests::restart_recovery_selection_across_10k_jobs_meets_release_budget -- --exact --nocapture

  windows:
    name: Windows canonical recovery and Tauri build
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm 10.34.5
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
          run_install: false

      - name: Install Node.js 22.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install stable Rust with Clippy
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Cache pinned FFmpeg archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-cache/ffmpeg-8.1.2-essentials_build.zip
          key: ffmpeg-windows-x86_64-db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch cached FFmpeg archive when absent
        shell: pwsh
        run: |
          $cacheDirectory = Join-Path $env:RUNNER_TEMP "ffmpeg-cache"
          $archive = Join-Path $cacheDirectory "ffmpeg-8.1.2-essentials_build.zip"
          New-Item -ItemType Directory -Force -Path $cacheDirectory | Out-Null
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            $partial = "$archive.partial"
            Invoke-WebRequest `
              -Uri "https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-essentials_build.zip" `
              -OutFile $partial `
              -MaximumRedirection 5 `
              -TimeoutSec 600
            Move-Item -LiteralPath $partial -Destination $archive
          }
          "FFMPEG_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Bootstrap and verify pinned bundled media tools
        shell: pwsh
        run: |
          pnpm --dir apps/desktop media:test:windows
          pnpm --dir apps/desktop media:bootstrap:windows -ArchivePath $env:FFMPEG_ARCHIVE
          pnpm --dir apps/desktop media:verify:windows

      - name: Build desktop frontend
        run: pnpm --dir apps/desktop build

      - name: Run Windows Clippy
        run: cargo clippy --locked --all-targets --all-features --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      - name: Test Windows native engine and process supervision
        run: cargo test --locked --all-features --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Repeat Windows lock and crash-recovery proof
        shell: pwsh
        run: |
          1..3 | ForEach-Object {
            cargo test --locked --all-features --manifest-path apps/desktop/src-tauri/Cargo.toml `
              video::project::tests::service_migration_commit_undo_redo_and_reopen_preserve_exact_state -- --exact
            cargo test --locked --all-features --manifest-path apps/desktop/src-tauri/Cargo.toml `
              video::project::tests::recovery_repairs_a_torn_tail_to_the_exact_snapshot_hash -- --exact
          }

      - name: Assemble Windows production executable with bundled media overlay
        run: >-
          pnpm --dir apps/desktop tauri build --no-bundle --ci
          --config src-tauri/tauri.media-tools.windows.conf.json

      - name: Verify Windows production executable
        shell: pwsh
        run: |
          $executable = "apps/desktop/src-tauri/target/release/supa-video-desktop.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Tauri did not produce $executable"
          }

      - name: Test startup benchmark pass/fail evaluation
        shell: pwsh
        run: pnpm --dir apps/desktop startup:test:windows

      - name: Smoke-test packaged startup with advisory performance reporting
        shell: pwsh
        run: |
          $ramMapRoot = Join-Path $env:RUNNER_TEMP "rammap"
          $ramMapArchive = Join-Path $ramMapRoot "RAMMap.zip"
          New-Item -ItemType Directory -Force -Path $ramMapRoot | Out-Null
          Invoke-WebRequest `
            -Uri "https://download.sysinternals.com/files/RAMMap.zip" `
            -OutFile $ramMapArchive `
            -TimeoutSec 120
          Expand-Archive -LiteralPath $ramMapArchive -DestinationPath $ramMapRoot -Force
          ./scripts/benchmark-packaged-startup-windows.ps1 `
            -ExecutablePath "apps/desktop/src-tauri/target/release/supa-video-desktop.exe" `
            -RamMapPath (Join-Path $ramMapRoot "RAMMap64.exe") `
            -Iterations 10 `
            -AdvisoryPerformance `
            -OutputPath "apps/desktop/src-tauri/target/release/startup-benchmark.json"

      - name: Archive packaged startup benchmark
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supa-video-producer-startup-${{ github.run_id }}
          path: apps/desktop/src-tauri/target/release/startup-benchmark.json
          if-no-files-found: error

      - name: Exercise packaged media production IPC with stripped PATH
        shell: pwsh
        run: |
          $cargo = (Get-Command cargo.exe -ErrorAction Stop).Source
          $originalPath = $env:PATH
          $env:SVP_MEDIA_RESOURCE_ROOT = (
            Resolve-Path "apps/desktop/src-tauri/target/release"
          ).Path
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          try {
            if (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue) {
              throw "The packaged media IPC gate must not resolve FFmpeg from PATH"
            }
            & $cargo test `
              --locked `
              --all-features `
              --manifest-path apps/desktop/src-tauri/Cargo.toml `
              tests::packaged_media_renamed_or_replaced_executable_fails_before_spawn `
              -- `
              --ignored `
              --exact `
              --nocapture `
              --test-threads=1
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged media rename/replacement fail-closed proof failed"
            }
            & $cargo test `
              --locked `
              --all-features `
              --manifest-path apps/desktop/src-tauri/Cargo.toml `
              tests::packaged_media_ipc_status_probe_prepare_and_render_complete `
              -- `
              --ignored `
              --exact `
              --nocapture `
              --test-threads=1
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged status/probe/prepare/render IPC integration failed"
            }
            & $cargo test `
              --locked `
              --all-features `
              --manifest-path apps/desktop/src-tauri/Cargo.toml `
              tests::packaged_media_ipc_render_cancel_cleans_partial `
              -- `
              --ignored `
              --exact `
              --nocapture `
              --test-threads=1
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged render cancellation IPC integration failed"
            }
            & $cargo test `
              --locked `
              --all-features `
              --manifest-path apps/desktop/src-tauri/Cargo.toml `
              tests::packaged_phase3b_hierarchical_preparation_and_restart_boundaries `
              -- `
              --ignored `
              --exact `
              --nocapture `
              --test-threads=1
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged Phase 3B hierarchical preparation and all restart-boundary proof failed"
            }
          }
          finally {
            $env:PATH = $originalPath
            Remove-Item Env:SVP_MEDIA_RESOURCE_ROOT -ErrorAction SilentlyContinue
          }

  windows-release:
    name: Signed Windows installers and clean-runner smoke
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [typescript, rust, windows]
    runs-on: windows-2025
    timeout-minutes: 75
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce approved FFmpeg distribution review
        shell: pwsh
        run: |
          $manifestPath = "apps/desktop/src-tauri/media-toolchain/manifest.v1.json"
          . "./scripts/bootstrap-ffmpeg-windows.ps1" -LoadFunctionsOnly
          $manifest = Read-StrictManifest $manifestPath
          if ($manifest.distributionReview.status -cne "approved") {
            throw "Public release is blocked: FFmpeg distribution review is not approved"
          }

      - name: Install pnpm 10.34.5
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
          run_install: false

      - name: Install Node.js 22.12.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable

      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Cache pinned FFmpeg archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-cache/ffmpeg-8.1.2-essentials_build.zip
          key: ffmpeg-windows-x86_64-db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch cached FFmpeg archive when absent
        shell: pwsh
        run: |
          $cacheDirectory = Join-Path $env:RUNNER_TEMP "ffmpeg-cache"
          $archive = Join-Path $cacheDirectory "ffmpeg-8.1.2-essentials_build.zip"
          New-Item -ItemType Directory -Force -Path $cacheDirectory | Out-Null
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            $partial = "$archive.partial"
            Invoke-WebRequest `
              -Uri "https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-essentials_build.zip" `
              -OutFile $partial `
              -MaximumRedirection 5 `
              -TimeoutSec 600
            Move-Item -LiteralPath $partial -Destination $archive
          }
          "FFMPEG_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Bootstrap and verify pinned bundled media tools
        shell: pwsh
        run: |
          pnpm --dir apps/desktop media:test:windows
          pnpm --dir apps/desktop media:bootstrap:windows -ArchivePath $env:FFMPEG_ARCHIVE
          pnpm --dir apps/desktop media:verify:windows

      - name: Import protected Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            throw "The release environment must provide WINDOWS_CERTIFICATE"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "The release environment must provide WINDOWS_CERTIFICATE_PASSWORD"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw "The release environment must provide WINDOWS_TIMESTAMP_URL"
          }

          $timestampUri = [Uri]$env:WINDOWS_TIMESTAMP_URL
          if (-not $timestampUri.IsAbsoluteUri -or $timestampUri.Scheme -notin @("http", "https")) {
            throw "WINDOWS_TIMESTAMP_URL must be an absolute HTTP(S) URL"
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          "WINDOWS_CERTIFICATE_PATH=$certificatePath" >> $env:GITHUB_ENV
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $importedCertificates = @(
            Import-PfxCertificate `
              -FilePath $certificatePath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password
          )
          $importedThumbprints = $importedCertificates.Thumbprint -join ","
          "WINDOWS_IMPORTED_CERTIFICATE_THUMBPRINTS=$importedThumbprints" >> $env:GITHUB_ENV
          $signingCertificates = @(
            $importedCertificates | Where-Object {
              $_.HasPrivateKey -and
              ($_.EnhancedKeyUsageList.ObjectId.Value -contains "1.3.6.1.5.5.7.3.3")
            }
          )
          if ($signingCertificates.Count -ne 1) {
            throw "The PFX must contain exactly one private-key code-signing certificate"
          }

          $thumbprint = $signingCertificates[0].Thumbprint
          $releaseConfigPath = Join-Path $env:RUNNER_TEMP "tauri.release.conf.json"
          $tauriRoot = (Resolve-Path "apps/desktop/src-tauri").Path
          $mediaOverlay = Get-Content `
            -LiteralPath "apps/desktop/src-tauri/tauri.media-tools.windows.conf.json" `
            -Raw | ConvertFrom-Json
          $releaseResources = @{}
          foreach ($resource in $mediaOverlay.bundle.resources.PSObject.Properties) {
            $releaseResources[(Join-Path $tauriRoot $resource.Name)] = $resource.Value
          }
          @{
            bundle = @{
              resources = $releaseResources
              windows = @{
                certificateThumbprint = $thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $releaseConfigPath -Encoding utf8

          "WINDOWS_CERTIFICATE_THUMBPRINT=$thumbprint" >> $env:GITHUB_ENV
          "TAURI_RELEASE_CONFIG=$releaseConfigPath" >> $env:GITHUB_ENV

      - name: Build signed MSI and NSIS installers
        shell: pwsh
        run: pnpm --dir apps/desktop tauri build --bundles msi,nsis --ci --config $env:TAURI_RELEASE_CONFIG

      - name: Verify installer set and Authenticode signatures
        shell: pwsh
        run: |
          $target = "apps/desktop/src-tauri/target/release"
          $application = Get-Item "$target/supa-video-desktop.exe"
          $msi = @(Get-ChildItem "$target/bundle/msi/*.msi")
          $nsis = @(Get-ChildItem "$target/bundle/nsis/*-setup.exe")
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) {
            throw "Expected exactly one MSI and one NSIS installer; found $($msi.Count) MSI and $($nsis.Count) NSIS"
          }

          foreach ($artifact in @($application) + $msi + $nsis) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            if ($signature.Status -ne "Valid") {
              throw "$($artifact.Name) has invalid Authenticode status: $($signature.Status)"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
              throw "$($artifact.Name) was not signed by the protected release certificate"
            }
          }

          $checksums = (@($application) + $msi + $nsis) | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          }
          $checksums | Set-Content "$target/bundle/SHA256SUMS.txt" -Encoding ascii

      - name: Verify MSI contains the complete bundled media payload
        shell: pwsh
        run: |
          $msi = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          $layout = Join-Path $env:RUNNER_TEMP "supa-video-msi-layout"
          $extract = Start-Process `
            -FilePath msiexec.exe `
            -ArgumentList "/a", "`"$($msi.FullName)`"", "/qn", "TARGETDIR=`"$layout`"" `
            -Wait `
            -PassThru
          if ($extract.ExitCode -ne 0) {
            throw "MSI administrative extraction exited with code $($extract.ExitCode)"
          }
          $requiredNames = @(
            "ffmpeg.exe",
            "ffprobe.exe",
            "manifest.v1.json",
            "THIRD_PARTY_NOTICES.md",
            "SOURCE_OFFER.md",
            "GPL-3.0.txt",
            "GYAN-FFMPEG-README.txt"
          )
          foreach ($name in $requiredNames) {
            $matches = @(Get-ChildItem -LiteralPath $layout -Recurse -File -Filter $name)
            if ($matches.Count -ne 1) {
              throw "MSI payload must contain exactly one $name; found $($matches.Count)"
            }
          }
          $manifest = Get-Content `
            -LiteralPath "apps/desktop/src-tauri/media-toolchain/manifest.v1.json" `
            -Raw | ConvertFrom-Json
          foreach ($toolName in @("ffmpeg", "ffprobe")) {
            $tool = Get-ChildItem -LiteralPath $layout -Recurse -File -Filter "$toolName.exe"
            $actual = (Get-FileHash -LiteralPath $tool.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = $manifest.targets.'x86_64-pc-windows-msvc'.binaries.$toolName.sha256
            if ($actual -cne $expected) {
              throw "MSI $toolName.exe hash does not match the compiled manifest"
            }
          }

      - name: Install, verify bundled media tools, and launch with stripped PATH
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/NS" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($install.ExitCode)"
          }

          $installRoot = Join-Path $env:LOCALAPPDATA "Supa Video Producer"
          $installedExecutable = Join-Path $installRoot "supa-video-desktop.exe"
          if (-not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)) {
            throw "NSIS did not install $installedExecutable"
          }
          $installedSignature = Get-AuthenticodeSignature -LiteralPath $installedExecutable
          if ($installedSignature.Status -ne "Valid") {
            throw "Installed executable has invalid Authenticode status: $($installedSignature.Status)"
          }

          $bytes = [IO.File]::ReadAllBytes($installedExecutable)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $peSignature = [Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4)
          if ($peSignature -ne "PE`0`0") {
            throw "Installed executable does not contain a valid PE signature"
          }
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "Installed release executable is not a Windows GUI binary; subsystem=$subsystem"
          }

          $manifestPath = "apps/desktop/src-tauri/media-toolchain/manifest.v1.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $mediaRoot = Join-Path $installRoot "media-tools"
          $requiredResources = @(
            "ffmpeg.exe",
            "ffprobe.exe",
            "manifest.v1.json",
            "THIRD_PARTY_NOTICES.md",
            "SOURCE_OFFER.md",
            "licenses/GPL-3.0.txt",
            "licenses/GYAN-FFMPEG-README.txt"
          )
          foreach ($relativePath in $requiredResources) {
            $resource = Join-Path $mediaRoot $relativePath
            if (-not (Test-Path -LiteralPath $resource -PathType Leaf)) {
              throw "NSIS installation is missing bundled resource $relativePath"
            }
          }

          $hashReport = @()
          foreach ($toolName in @("ffmpeg", "ffprobe")) {
            $path = Join-Path $mediaRoot "$toolName.exe"
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = $manifest.targets.'x86_64-pc-windows-msvc'.binaries.$toolName.sha256
            if ($actual -cne $expected) {
              throw "Installed $toolName.exe hash does not match the compiled manifest"
            }
            $hashReport += "$actual  media-tools/$toolName.exe"
          }
          foreach ($relativePath in $requiredResources | Where-Object { $_ -notlike "*.exe" }) {
            $path = Join-Path $mediaRoot $relativePath
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashReport += "$hash  media-tools/$relativePath"
          }
          $hashReportPath = "apps/desktop/src-tauri/target/release/bundle/INSTALLED_MEDIA_TOOLS_SHA256.txt"
          $hashReport | Set-Content -LiteralPath $hashReportPath -Encoding ascii

          $originalPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          try {
            $ffmpeg = Join-Path $mediaRoot "ffmpeg.exe"
            $ffprobe = Join-Path $mediaRoot "ffprobe.exe"
            $ffmpegVersion = (& $ffmpeg -hide_banner -version 2>&1) -join "`n"
            if ($LASTEXITCODE -ne 0 -or -not $ffmpegVersion.Contains("ffmpeg version $($manifest.ffmpeg.version)")) {
              throw "Installed FFmpeg version probe failed with stripped PATH"
            }
            $ffprobeVersion = (& $ffprobe -hide_banner -version 2>&1) -join "`n"
            if ($LASTEXITCODE -ne 0 -or -not $ffprobeVersion.Contains("ffprobe version $($manifest.ffmpeg.version)")) {
              throw "Installed FFprobe version probe failed with stripped PATH"
            }
            $buildConfiguration = (& $ffmpeg -hide_banner -buildconf 2>&1) -join "`n"
            foreach ($flag in $manifest.ffmpeg.requiredBuildFlags) {
              if (-not $buildConfiguration.Contains($flag)) {
                throw "Installed FFmpeg is missing build flag $flag"
              }
            }
            foreach ($probe in @(
              @{ Arguments = @("-hide_banner", "-encoders"); Required = $manifest.targets.'x86_64-pc-windows-msvc'.requiredCapabilities.encoders },
              @{ Arguments = @("-hide_banner", "-muxers"); Required = $manifest.targets.'x86_64-pc-windows-msvc'.requiredCapabilities.muxers },
              @{ Arguments = @("-hide_banner", "-filters"); Required = $manifest.targets.'x86_64-pc-windows-msvc'.requiredCapabilities.filters }
            )) {
              $arguments = @($probe.Arguments)
              $output = (& $ffmpeg $arguments 2>&1) -join "`n"
              if ($LASTEXITCODE -ne 0) {
                throw "Installed FFmpeg capability probe failed"
              }
              foreach ($capability in $probe.Required) {
                if ($output -notmatch "(?m)^\s*[A-Z\.]{1,8}\s+$([regex]::Escape($capability))\s") {
                  throw "Installed FFmpeg is missing capability $capability"
                }
              }
            }

            $application = Start-Process -FilePath $installedExecutable -PassThru
            Start-Sleep -Seconds 10
            $application.Refresh()
            if ($application.HasExited) {
              throw "Installed application exited during stripped-PATH launch with code $($application.ExitCode)"
            }
            Stop-Process -Id $application.Id -Force
          }
          finally {
            $env:PATH = $originalPath
          }

      - name: Archive verified Windows release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supa-video-producer-windows-${{ github.event.release.tag_name }}
          path: |
            apps/desktop/src-tauri/target/release/supa-video-desktop.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
            apps/desktop/src-tauri/target/release/bundle/INSTALLED_MEDIA_TOOLS_SHA256.txt
            apps/desktop/src-tauri/media-toolchain/manifest.v1.json
            apps/desktop/src-tauri/media-toolchain/THIRD_PARTY_NOTICES.md
            apps/desktop/src-tauri/media-toolchain/SOURCE_OFFER.md
            apps/desktop/src-tauri/media-toolchain/licenses/GPL-3.0.txt
            apps/desktop/src-tauri/media-toolchain/licenses/GYAN-FFMPEG-README.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove installed app and signing material
        if: always()
        shell: pwsh
        run: |
          Get-Process "supa-video-desktop" -ErrorAction SilentlyContinue | Stop-Process -Force
          $uninstaller = Join-Path $env:LOCALAPPDATA "Supa Video Producer/uninstall.exe"
          if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) {
              Write-Warning "NSIS uninstaller exited with code $($uninstall.ExitCode)"
            }
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_IMPORTED_CERTIFICATE_THUMBPRINTS)) {
            $env:WINDOWS_IMPORTED_CERTIFICATE_THUMBPRINTS.Split(",") | ForEach-Object {
              Remove-Item "Cert:\CurrentUser\My\$_" -Force -ErrorAction SilentlyContinue
            }
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PATH)) {
            Remove-Item $env:WINDOWS_CERTIFICATE_PATH -Force -ErrorAction SilentlyContinue
          }
          if (-not [string]::IsNullOrWhiteSpace($env:TAURI_RELEASE_CONFIG)) {
            Remove-Item $env:TAURI_RELEASE_CONFIG -Force -ErrorAction SilentlyContinue
          }
