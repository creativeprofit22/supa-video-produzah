[package]
name = "supa-video-desktop"
version = "0.1.0"
description = "Standalone single-clip video producer"
authors = ["Supa Video Producer contributors"]
edition = "2021"
rust-version = "1.94"

[lib]
name = "supa_video_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop-runtime"]
desktop-runtime = [
  "tauri/common-controls-v6",
  "tauri/compression",
  "tauri/dbus",
  "tauri/dynamic-acl",
  "tauri/protocol-asset",
  "tauri/wry",
  "tauri/x11",
]
tauri-ipc-test = ["tauri/test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"] }
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
# OS CSPRNG for OAuth state and PKCE verifiers (already in the graph).
getrandom = "=0.2.17"
# Font shaping and line breaking for text layout and QC (system fonts off).
parley = { version = "=0.11.1", default-features = false, features = ["std"] }
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
process-wrap = { version = "=9.1.0", default-features = false, features = ["tokio1", "creation-flags", "kill-on-drop", "process-group", "job-object"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.10.9"
tauri = { version = "2", default-features = false, features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
tempfile = "=3.27.0"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "=1.11.0"
tokio = { version = "=1.53.1", features = ["test-util"] }

# Keep full bundled-binary integrity checks within their test deadlines without
# optimizing application code or changing the release profile. Set on the dev
# profile (which the test profile inherits) so debug app runs can verify the
# ~1.2 GB speech runtime in seconds instead of many minutes.
[profile.dev.package.sha2]
opt-level = 3

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Storage_FileSystem", "Win32_System_Threading"] }
