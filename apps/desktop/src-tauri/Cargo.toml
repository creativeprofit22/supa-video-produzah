[package]
name = "supa-video-desktop"
version = "0.1.0"
description = "Standalone single-clip video producer"
authors = ["Supa Video Producer contributors"]
edition = "2021"
rust-version = "1.87"

[lib]
name = "supa_video_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

