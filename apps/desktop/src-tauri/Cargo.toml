[package]
name = "supa-video-desktop"
version = "0.1.0"
description = "Standalone single-clip video producer"
authors = ["Supa Video Producer contributors"]
edition = "2021"
rust-version = "1.87"

[lib]
name = "supa_video_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop-runtime"]
desktop-runtime = [
  "tauri/common-controls-v6",
  "tauri/compression",
  "tauri/dbus",
  "tauri/dynamic-acl",
  "tauri/protocol-asset",
  "tauri/wry",
  "tauri/x11",
]
tauri-ipc-test = ["tauri/test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"] }
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
process-wrap = { version = "=9.1.0", default-features = false, features = ["tokio1", "creation-flags", "kill-on-drop", "process-group", "job-object"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri = { version = "2", default-features = false, features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.7.2"
tempfile = "=3.27.0"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "process", "rt", "time"] }
uuid = { version = "=1.24.0", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Threading"] }
