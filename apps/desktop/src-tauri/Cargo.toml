[package]
name = "supa-video-desktop"
version = "0.1.0"
description = "Standalone single-clip video producer"
authors = ["Supa Video Producer contributors"]
edition = "2021"
rust-version = "1.87"

[lib]
name = "supa_video_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.2"
tempfile = "=3.27.0"
thiserror = "=2.0.19"
uuid = { version = "=1.24.0", features = ["serde"] }
