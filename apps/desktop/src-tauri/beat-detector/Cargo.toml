[package]
name = "supa-beat-detect"
version = "0.1.0"
description = "Detects music beats and downbeats with the Beat This! final0 model (ONNX), on CUDA or CPU"
edition = "2024"
publish = false

# Kept out of the desktop app's dependency graph on purpose: ONNX Runtime and CUDA are loaded at
# run time from a user-chosen runtime folder (see docs/adr/0004-music-beat-detection-sidecar.md).
[workspace]

[[bin]]
name = "supa-beat-detect"
path = "src/main.rs"

[dependencies]
beat-this = { version = "=1.1.0", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "cuda"] }
anyhow = "1"
hound = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hound = "3"
sha2 = "0.10"

[profile.release]
debug = false
